<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ijtimah 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#0b1730;--surface:#112245;--text:#f4edda;--muted:#93a0bf;--line:#2d4a85;--accent:#e2b44c;--accent-soft:#16305e;--ok:#7fdca5;--bad:#ff8a7a;--badbg:#3a1f2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:40px 20px 110px;position:relative}
.view{display:none;opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease}
.view.show{display:block}
.view.on{opacity:1;transform:none}
h1{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.05}
h2{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin:0 0 20px}
.home{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:36px}
.home p{margin:10px 0 0;color:var(--muted);font-size:1.05rem}
.opts{display:grid;gap:14px}
.opt{font:inherit;text-align:left;cursor:pointer;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:22px 24px;font-size:1.15rem;font-weight:600;display:flex;justify-content:space-between;align-items:center;transition:border-color .2s,transform .2s,background .2s}
.opt:hover{border-color:var(--accent);transform:translateY(-2px)}
.opt:active{transform:none}
.opt span{color:var(--muted);font-weight:500;font-size:.9rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{padding:0;text-align:left;border:1px solid var(--line)}
th{font-size:.8rem;font-weight:700;color:var(--accent);padding:14px 16px;border:1px solid var(--line);background:#0c1b3a;letter-spacing:.06em}
th:not(:first-child){text-align:right}
td.name{padding:0 16px;font-weight:600;font-size:.92rem;white-space:nowrap}
td.name .rm{margin-left:8px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;opacity:0;transition:opacity .2s}
tr:hover .rm,.rm:focus-visible{opacity:1}
tbody tr+tr td{border-top:1px solid var(--line)}
td input{width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:14px 16px;min-height:48px}
td input:focus{outline:none;background:var(--accent-soft)}
td input::placeholder{color:#4a6194}
tfoot td{padding:16px;font-weight:800;background:var(--accent);color:#0b1730;border:1px solid var(--accent);font-variant-numeric:tabular-nums;text-align:right}
tfoot td:first-child{text-align:left}
.add{margin-top:14px;opacity:.45;transition:opacity .25s;display:flex;gap:8px}
.add:hover,.add:focus-within{opacity:1}
.add input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1px dashed var(--muted);border-radius:12px;background:transparent;color:var(--text);text-transform:uppercase}
.add input::placeholder{text-transform:none}
.add button{font:inherit;font-weight:600;border:1px dashed var(--muted);border-radius:12px;background:transparent;color:var(--text);padding:12px 18px;cursor:pointer}
.add button:hover{border-color:var(--accent);color:var(--accent)}
.check{margin-top:28px;border-radius:16px;padding:18px 20px;background:var(--accent-soft);border:1px solid transparent;transition:background .3s}
.check.bad{background:var(--badbg);border-color:var(--bad)}
.check h3{margin:0 0 4px;font-size:1rem;display:flex;align-items:center;gap:8px}
.check .st{color:var(--ok)}
.check.bad .st{color:var(--bad)}
.check small{color:var(--muted);display:block;margin-bottom:12px}
.chk{display:grid;grid-template-columns:1fr auto auto;gap:4px 16px;font-size:.88rem;font-variant-numeric:tabular-nums}
.chk b{font-weight:700}
.chk .h{color:var(--muted);font-size:.78rem}
.chk .r{text-align:right}
.back{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s,border-color .2s;z-index:5}
.back.on{opacity:1;pointer-events:auto}
.back:hover{border-color:var(--accent)}
body{background:radial-gradient(ellipse at 50% -10%,#1d3a7a 0,transparent 60%),radial-gradient(circle at 100% 100%,rgba(226,180,76,.12) 0,transparent 45%),#0b1730 fixed}
h1,h2{color:var(--accent);text-align:center}
.home{text-align:center}
.opt{justify-content:center;text-align:center}
h1{text-shadow:0 2px 30px rgba(226,180,76,.25)}
.home p{color:#b9c3dc}
.opt{background:linear-gradient(135deg,#17306a,#0f2147);border:1px solid #3a5aa0;border-left:5px solid var(--accent);color:var(--text);font-size:1.25rem;padding:26px 24px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.opt:hover{border-color:var(--accent);box-shadow:0 8px 28px rgba(226,180,76,.22)}
.card{border-color:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
td.name{background:#0f2147;color:var(--text)}
td input:focus{background:#1c3a74}
.add button,.add input{border-color:#5a73a8}
.check{background:#10294a;border:1px solid var(--line)}
.check.bad{background:var(--badbg);border-color:var(--bad)}
td input{text-align:center}
th:not(:first-child){text-align:center}
tfoot td{text-align:center}
.ck{display:flex;align-items:center;justify-content:space-between;gap:12px}
.check small{margin:0}
.reload{font:inherit;font-weight:600;font-size:.88rem;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:9px 16px;cursor:pointer;transition:background .2s,color .2s}
.reload:hover{background:var(--accent);color:#0b1730}
.back{background:#112245;border-color:var(--accent);color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section class="view show on" id="v-home">
    <div class="home">
      <div><h1>Ijtimah 2026</h1><p>Choose a section to view or edit.</p></div>
      <div class="opts">
        <button class="opt" data-go="areas">Areas Data</button>
        <button class="opt" data-go="manchester">Manchester Totals</button>
      </div>
    </div>
  </section>
  <section class="view" id="v-areas"></section>
  <section class="view" id="v-manchester"></section>
</main>
<button class="back" id="back" aria-label="Back to main page">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
</button>
<script>
const SECTIONS={
 areas:{title:"Areas Data",cols:[["e","ESTIMATED"],["a","ACTUAL"],["n","NIGHT"]],
  names:["BIRMINGHAM","BLACKBURN","BOLTON","BRADFORD","BRISTOL","BURNLEY","COVENTRY","CROYDON","LEICESTER","LIVERPOOL","LUTON","MANCHESTER","PETERBOROUGH","SCOTLAND"]},
 manchester:{title:"Manchester Totals",cols:[["m","MASJIDS"],["s","SHOPS"]],
  names:["MANCHESTER","ASHTON","OLDHAM","STOKE-ON-TRENT","BIRMINGHAM"]}
};
const KEY="ijtimah2026-v1";
let state={};
try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}
for(const k in SECTIONS){
  if(!state[k]||!Array.isArray(state[k]))state[k]=SECTIONS[k].names.map(n=>({name:n}));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const num=v=>{const n=parseInt(v,10);return Number.isFinite(n)?n:0};
const fmt=n=>n.toLocaleString("en-GB");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function build(key){
  const S=SECTIONS[key],el=document.getElementById("v-"+key);
  const head=S.cols.map(c=>`<th>${c[1]}</th>`).join("");
  const rows=state[key].map((r,i)=>`<tr data-i="${i}"><td class="name">${esc(r.name)}${r.custom?`<button class="rm" aria-label="Remove ${esc(r.name)}">&times;</button>`:""}</td>${S.cols.map(c=>`<td><input inputmode="numeric" autocomplete="off" maxlength="9" placeholder="0" data-k="${c[0]}" aria-label="${esc(r.name)} ${c[1].toLowerCase()}" value="${r[c[0]]??""}"></td>`).join("")}</tr>`).join("");
  el.innerHTML=`<h2>${S.title}</h2>
  <div class="card"><div class="scroll"><table><thead><tr><th>AREA</th>${head}</tr></thead>
  <tbody>${rows}</tbody>
  <tfoot><tr><td>TOTAL</td>${S.cols.map(c=>`<td data-total="${c[0]}">0</td>`).join("")}</tr></tfoot></table></div></div>
  <div class="add"><input placeholder="Add an area" maxlength="30" aria-label="New area name"><button>Add area</button></div>
  <div class="check" id="chk-${key}"></div>`;
  refresh(key);
}

function refresh(key){
  const S=SECTIONS[key],el=document.getElementById("v-"+key);
  const rows=state[key];
  const res=S.cols.map(([k,label])=>{
    // 1: from stored data
    const fromData=rows.reduce((s,r)=>s+num(r[k]),0);
    // 2: from what is actually typed in the boxes
    let fromBoxes=0;el.querySelectorAll(`tbody input[data-k="${k}"]`).forEach(i=>fromBoxes+=num(i.value));
    // 3: from the total shown on screen
    const cell=el.querySelector(`[data-total="${k}"]`);
    cell.textContent=fmt(fromData);
    const shown=num(cell.textContent.replace(/[^0-9]/g,""));
    return {label,fromData,fromBoxes,shown,ok:fromData===fromBoxes&&fromBoxes===shown};
  });
  const ok=res.every(r=>r.ok);
  const box=document.getElementById("chk-"+key);
  box.className="check"+(ok?"":" bad");
  box.innerHTML=`<div class="ck"><div><h3><span class="st">${ok?"&#10003;":"&#9888;"}</span>${ok?"All totals verified":"Totals do not match"}</h3><small>Last updated ${new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</small></div><button class="reload" type="button">Reload</button></div>`;
}

Object.keys(SECTIONS).forEach(key=>{
  build(key);
  const el=document.getElementById("v-"+key);
  el.addEventListener("input",e=>{
    const inp=e.target;
    if(!inp.matches("tbody input"))return;
    const clean=inp.value.replace(/\D/g,"");
    if(clean!==inp.value)inp.value=clean;
    const i=+inp.closest("tr").dataset.i;
    state[key][i][inp.dataset.k]=clean;
    save();refresh(key);
  });
  el.addEventListener("click",e=>{
    const rm=e.target.closest(".rm");
    if(rm){state[key].splice(+rm.closest("tr").dataset.i,1);save();build(key);return}
    if(e.target.closest(".reload")){refresh(key);return}
    if(e.target.closest(".add button"))addArea(key);
  });
  el.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.closest(".add"))addArea(key)});
});
function addArea(key){
  const el=document.getElementById("v-"+key),inp=el.querySelector(".add input");
  const name=inp.value.trim().toUpperCase();
  if(!name){inp.focus();return}
  state[key].push({name,custom:true});
  save();build(key);
  el.querySelector("tbody tr:last-child input").focus();
}

// Navigation with gentle fades
let current="home";
const back=document.getElementById("back");
function show(id){
  if(id===current)return;
  const from=document.getElementById("v-"+current),to=document.getElementById("v-"+id);
  from.classList.remove("on");
  current=id;
  back.classList.toggle("on",id!=="home");
  setTimeout(()=>{
    from.classList.remove("show");
    to.classList.add("show");
    window.scrollTo(0,0);
    requestAnimationFrame(()=>requestAnimationFrame(()=>to.classList.add("on")));
  },300);
}
function route(){const h=location.hash.slice(1);show(SECTIONS[h]?h:"home")}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{location.hash=b.dataset.go}));
back.addEventListener("click",()=>{history.pushState(null,"",location.pathname+location.search);route()});
window.addEventListener("hashchange",route);
window.addEventListener("popstate",route);
route();
</script>
</body>
</html>
